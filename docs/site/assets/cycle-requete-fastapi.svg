<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" role="img" aria-label="Cycle de vie d'une requête dans FastAPI">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arr-ko" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="840" height="560" fill="#ffffff"/>
  <text x="420" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Cycle de vie d'une requête dans FastAPI</text>

  <line x1="60" y1="72" x2="60" y2="500" stroke="#cbd5e1" stroke-width="2"/>

  <g font-family="system-ui, sans-serif" font-size="13.5" fill="#1f2937">
    <circle cx="60" cy="72" r="15" fill="#4f46e5"/>
    <text x="60" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="90" y="77">Le serveur ASGI (Uvicorn) reçoit la requête HTTP</text>

    <circle cx="60" cy="140" r="15" fill="#4f46e5"/>
    <text x="60" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="90" y="145">Routage : méthode + chemin → fonction de route</text>
    <text x="90" y="163" font-size="12" fill="#64748b">chemin inconnu → 404, méthode non prévue → 405</text>

    <circle cx="60" cy="226" r="15" fill="#4f46e5"/>
    <text x="60" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text x="90" y="231">Dépendances (<tspan font-family="ui-monospace, Consolas, monospace" font-size="12.5">Depends</tspan>) : authentification, dépôt, pagination</text>
    <text x="90" y="249" font-size="12" fill="#64748b">échec → 401 ou 403</text>

    <circle cx="60" cy="312" r="15" fill="#4f46e5"/>
    <text x="60" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
    <text x="90" y="317">Validation Pydantic : chemin, requête, en-têtes, corps JSON</text>
    <text x="90" y="335" font-size="12" fill="#64748b">échec → 422 avec le détail champ par champ</text>

    <circle cx="60" cy="398" r="15" fill="#4f46e5"/>
    <text x="60" y="403" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
    <text x="90" y="403">La fonction de route exécute la logique métier</text>
    <text x="90" y="421" font-size="12" fill="#64748b">erreur métier → 404, 409…</text>

    <circle cx="60" cy="470" r="15" fill="#0f766e"/>
    <text x="60" y="475" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text>
    <text x="90" y="475">Sérialisation via <tspan font-family="ui-monospace, Consolas, monospace" font-size="12.5">response_model</tspan> → réponse HTTP (statut, en-têtes, JSON)</text>
  </g>

  <!-- gestionnaires d'exceptions -->
  <rect x="560" y="196" width="250" height="150" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="685" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">Gestionnaires d'exceptions</text>
  <text x="685" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#1f2937">un seul format d'erreur :</text>
  <text x="685" y="268" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#1f2937">application/problem+json</text>
  <text x="685" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">type, title, status, code,</text>
  <text x="685" y="313" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">detail, instance, errors</text>

  <path d="M520,238 C540,238 545,250 558,250" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-ko)"/>
  <path d="M520,322 C540,322 545,300 558,300" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-ko)"/>
  <path d="M440,414 C520,414 540,340 600,348" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-ko)"/>
  <path d="M600,148 C640,148 700,170 700,194" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-ko)"/>
</svg>
