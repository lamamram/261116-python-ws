<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" role="img" aria-label="Flux d'authentification HTTP BASIC et Bearer">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-ko" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="840" height="470" fill="#ffffff"/>
  <text x="420" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Deux schémas d'authentification fréquents</text>
  <line x1="420" y1="50" x2="420" y2="450" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===== BASIC ===== -->
  <text x="210" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4f46e5">HTTP BASIC</text>
  <rect x="40" y="80" width="110" height="34" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="95" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937">Client</text>
  <rect x="270" y="80" width="110" height="34" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="325" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937">Service</text>
  <line x1="95" y1="114" x2="95" y2="440" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="325" y1="114" x2="325" y2="440" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <g font-family="system-ui, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="210" y="146">1. GET /ressource (sans identifiants)</text>
    <text x="210" y="216" fill="#b91c1c">2. 401 Unauthorized</text>
    <text x="210" y="232" fill="#b91c1c" font-size="11">WWW-Authenticate: Basic realm="..."</text>
    <text x="210" y="290">3. GET /ressource</text>
    <text x="210" y="306" font-size="11" font-family="ui-monospace, Consolas, monospace">Authorization: Basic base64(id:mdp)</text>
    <text x="210" y="376" fill="#0f766e">4. 200 OK + représentation</text>
  </g>
  <line x1="97" y1="158" x2="323" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="323" y1="242" x2="97" y2="242" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-ko)"/>
  <line x1="97" y1="318" x2="323" y2="318" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="323" y1="388" x2="97" y2="388" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-ok)"/>
  <text x="210" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#64748b">base64 n'est pas un chiffrement : HTTPS obligatoire</text>

  <!-- ===== BEARER ===== -->
  <text x="630" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4f46e5">BEARER TOKEN</text>
  <rect x="460" y="80" width="110" height="34" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="515" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937">Client</text>
  <rect x="690" y="80" width="110" height="34" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="745" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937">Service</text>
  <line x1="515" y1="114" x2="515" y2="440" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="745" y1="114" x2="745" y2="440" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="474" y="128" width="282" height="40" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="615" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2937">0. Jeton créé une fois dans la console du fournisseur</text>
  <text x="615" y="161" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">(affiché une seule fois, portée limitée par scopes)</text>

  <g font-family="system-ui, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="630" y="206">1. GET /ressource</text>
    <text x="630" y="222" font-size="11" font-family="ui-monospace, Consolas, monospace">Authorization: Bearer &lt;jeton&gt;</text>
    <text x="630" y="290" fill="#0f766e">2a. 200 OK + représentation</text>
    <text x="630" y="338" fill="#b91c1c">2b. 401 : jeton absent, expiré ou révoqué</text>
    <text x="630" y="386" fill="#b91c1c">2c. 403 : jeton valide mais scope insuffisant</text>
  </g>
  <line x1="517" y1="234" x2="743" y2="234" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="743" y1="300" x2="517" y2="300" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-ok)"/>
  <line x1="743" y1="348" x2="517" y2="348" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-ko)"/>
  <line x1="743" y1="396" x2="517" y2="396" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-ko)"/>
  <text x="630" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#64748b">le jeton ne transite jamais dans l'URL</text>
</svg>
