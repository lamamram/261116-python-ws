<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-label="Équivalences entre FastAPI et Django-Ninja">
  <rect width="860" height="470" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Mêmes idées, deux frameworks : table d'équivalences</text>

  <rect x="24" y="48" width="400" height="30" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.3"/>
  <text x="224" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e">FastAPI (jour 2)</text>
  <rect x="436" y="48" width="400" height="30" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.3"/>
  <text x="636" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4f46e5">Django-Ninja (jour 3)</text>

  <g font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#1f2937">
    <text x="36" y="108">BaseModel (Pydantic)</text>
    <text x="448" y="108">ninja.Schema</text>

    <text x="36" y="144">APIRouter(prefix=...)</text>
    <text x="448" y="144">Router() + api.add_router(...)</text>

    <text x="36" y="180">response_model=Formation</text>
    <text x="448" y="180">response=FormationOut</text>

    <text x="36" y="216">Query(alias="page[size]", ge=1)</text>
    <text x="448" y="216">Query[int, P(alias="page[size]", ge=1)]</text>

    <text x="36" y="252">Depends(exiger("..."))</text>
    <text x="448" y="252">auth=BearerJeton() + décorateur</text>

    <text x="36" y="288">HTTPBearer / HTTPBasic</text>
    <text x="448" y="288">HttpBearer / HttpBasicAuth</text>

    <text x="36" y="324">@app.exception_handler(...)</text>
    <text x="448" y="324">@api.exception_handler(...)</text>

    <text x="36" y="360">Response (en-têtes, Location)</text>
    <text x="448" y="360">response: HttpResponse</text>

    <text x="36" y="396">TestClient + dependency_overrides</text>
    <text x="448" y="396">django.test.Client + fixtures</text>

    <text x="36" y="432">Stockage en mémoire</text>
    <text x="448" y="432">modèles Django + ORM</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="24" y1="122" x2="836" y2="122"/><line x1="24" y1="158" x2="836" y2="158"/>
    <line x1="24" y1="194" x2="836" y2="194"/><line x1="24" y1="230" x2="836" y2="230"/>
    <line x1="24" y1="266" x2="836" y2="266"/><line x1="24" y1="302" x2="836" y2="302"/>
    <line x1="24" y1="338" x2="836" y2="338"/><line x1="24" y1="374" x2="836" y2="374"/>
    <line x1="24" y1="410" x2="836" y2="410"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">
    <text x="430" y="108">⇄</text><text x="430" y="144">⇄</text><text x="430" y="180">⇄</text>
    <text x="430" y="216">⇄</text><text x="430" y="252">⇄</text><text x="430" y="288">⇄</text>
    <text x="430" y="324">⇄</text><text x="430" y="360">⇄</text><text x="430" y="396">⇄</text><text x="430" y="432">⇄</text>
  </g>
</svg>
