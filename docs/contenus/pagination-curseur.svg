<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="Pagination par curseur">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="800" height="330" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Pagination par curseur : on suit next_cursor jusqu'à la fin</text>

  <g font-family="system-ui, sans-serif" fill="#1f2937">
    <rect x="24" y="60" width="220" height="150" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="134" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">Page 1</text>
    <text x="134" y="108" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">GET /users?page[size]=25</text>
    <text x="134" y="140" text-anchor="middle" font-size="12.5">data : 25 éléments</text>
    <text x="134" y="162" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">has_more : true</text>
    <text x="134" y="182" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">next_cursor : "c1"</text>

    <rect x="290" y="60" width="220" height="150" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="400" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">Page 2</text>
    <text x="400" y="108" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">...&amp;page[after]=c1</text>
    <text x="400" y="140" text-anchor="middle" font-size="12.5">data : 25 éléments</text>
    <text x="400" y="162" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">has_more : true</text>
    <text x="400" y="182" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">next_cursor : "c2"</text>

    <rect x="556" y="60" width="220" height="150" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="666" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">Dernière page</text>
    <text x="666" y="108" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">...&amp;page[after]=c2</text>
    <text x="666" y="140" text-anchor="middle" font-size="12.5">data : 1 à 25 éléments</text>
    <text x="666" y="162" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">has_more : false</text>
    <text x="666" y="182" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">next_cursor : null</text>
  </g>

  <line x1="246" y1="135" x2="288" y2="135" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="512" y1="135" x2="554" y2="135" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>

  <rect x="24" y="238" width="752" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <g font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#1f2937">
    <text x="40" y="264">while meta["has_more"]:</text>
    <text x="40" y="284">    params["page[after]"] = meta["next_cursor"]   # même requête, même filtres</text>
  </g>
  <text x="760" y="264" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">le curseur est opaque : ne jamais le fabriquer</text>
</svg>
