<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-label="Anatomie d'une requête et d'une réponse HTTP">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arr-retour" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="780" height="480" fill="#ffffff"/>
  <text x="390" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Anatomie d'un échange HTTP avec une API REST</text>

  <!-- client -->
  <rect x="16" y="190" width="130" height="110" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="81" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Client</text>
  <text x="81" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">script Python</text>
  <text x="81" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">requests / httpx</text>

  <!-- serveur -->
  <rect x="634" y="190" width="130" height="110" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="699" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Service REST</text>
  <text x="699" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">ressources +</text>
  <text x="699" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">représentations JSON</text>

  <!-- carte requête -->
  <rect x="176" y="52" width="428" height="190" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="192" y="76" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4f46e5">REQUÊTE</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#1f2937">
    <text x="192" y="104"><tspan fill="#4f46e5" font-weight="700">GET</tspan> /public/v3/users?page[size]=5 HTTP/1.1</text>
    <text x="192" y="132">Host: gorest.co.in</text>
    <text x="192" y="152">Accept: application/json</text>
    <text x="192" y="172">Authorization: Bearer &lt;jeton&gt;</text>
    <text x="192" y="212" fill="#64748b">(ligne vide)  corps : absent pour un GET</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#4f46e5">
    <text x="592" y="104" text-anchor="end">① méthode + cible</text>
    <text x="592" y="152" text-anchor="end">② en-têtes</text>
    <text x="592" y="212" text-anchor="end">③ corps</text>
  </g>
  <line x1="146" y1="222" x2="174" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="606" y1="222" x2="632" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- carte réponse -->
  <rect x="176" y="256" width="428" height="206" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="192" y="280" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e">RÉPONSE</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#1f2937">
    <text x="192" y="308">HTTP/1.1 <tspan fill="#0f766e" font-weight="700">200 OK</tspan></text>
    <text x="192" y="336">Content-Type: application/json</text>
    <text x="192" y="356">ETag: "..."</text>
    <text x="192" y="376">RateLimit: ...</text>
    <text x="192" y="404" fill="#64748b">(ligne vide)</text>
    <text x="192" y="424">{ "data": [ {...}, ... ],</text>
    <text x="192" y="444">  "meta": { "has_more": true, ... } }</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#0f766e">
    <text x="592" y="308" text-anchor="end">④ code de statut</text>
    <text x="592" y="356" text-anchor="end">⑤ en-têtes</text>
    <text x="592" y="434" text-anchor="end">⑥ corps (représentation)</text>
  </g>
  <line x1="632" y1="276" x2="606" y2="276" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-retour)"/>
  <line x1="174" y1="276" x2="148" y2="276" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-retour)"/>
</svg>
